apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: newchapter-web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "5"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/container-dependencies: '{"web":["orchestrator"]}'
    spec:
      containerConcurrency: 80
      serviceAccountName: newchapter-orch-runtime@projectbucket-501814.iam.gserviceaccount.com
      timeoutSeconds: 300
      containers:
        - name: web
          image: __WEB_IMAGE__
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ORCHESTRATOR_BASE_URL
              value: http://127.0.0.1:8081
            - name: ORCHESTRATOR_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: newchapter-orchestrator-token
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
        - name: orchestrator
          image: __ORCHESTRATOR_IMAGE__
          env:
            - name: PORT
              value: "8081"
            - name: GOOGLE_CLOUD_PROJECT
              value: projectbucket-501814
            - name: GOOGLE_CLOUD_LOCATION
              value: global
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: VERTEX_MODEL
              value: gemini-2.5-flash
            - name: ORCHESTRATOR_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: newchapter-orchestrator-token
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 12
