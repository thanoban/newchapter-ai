name: Deploy to Google Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-gcp
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: projectbucket-501814
  PROJECT_NUMBER: "1038855716597"
  REGION: asia-south1
  ARTIFACT_REPOSITORY: newchapter
  WEB_SERVICE: newchapter-web
  ORCHESTRATOR_SERVICE: newchapter-orchestrator
  WEB_RUNTIME_SERVICE_ACCOUNT: newchapter-web-runtime@projectbucket-501814.iam.gserviceaccount.com
  ORCHESTRATOR_RUNTIME_SERVICE_ACCOUNT: newchapter-orch-runtime@projectbucket-501814.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: newchapter-deployer@projectbucket-501814.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/1038855716597/locations/global/workloadIdentityPools/github-pool/providers/newchapter-provider

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Verify web application
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orchestrator/pyproject.toml

      - name: Install orchestrator
        working-directory: services/orchestrator
        run: pip install -e ".[dev]"

      - name: Verify orchestrator
        working-directory: services/orchestrator
        run: python -m pytest

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Sign in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v7
        with:
          context: services/orchestrator
          file: services/orchestrator/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/orchestrator:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/orchestrator:latest
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator

      - name: Deploy orchestrator
        id: deploy-orchestrator
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.ORCHESTRATOR_SERVICE }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/orchestrator:${{ github.sha }}
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global
            GOOGLE_GENAI_USE_VERTEXAI=true
            VERTEX_MODEL=gemini-2.5-flash
          secrets: |
            ORCHESTRATOR_SERVICE_TOKEN=newchapter-orchestrator-token:latest
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.ORCHESTRATOR_RUNTIME_SERVICE_ACCOUNT }}
            --port=8080
            --cpu=1
            --memory=512Mi
            --concurrency=40
            --min-instances=0
            --max-instances=3

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/web:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Deploy web application
        id: deploy-web
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.WEB_SERVICE }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/web:${{ github.sha }}
          env_vars: |
            ORCHESTRATOR_BASE_URL=${{ steps.deploy-orchestrator.outputs.url }}
          secrets: |
            ORCHESTRATOR_SERVICE_TOKEN=newchapter-orchestrator-token:latest
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.WEB_RUNTIME_SERVICE_ACCOUNT }}
            --port=8080
            --cpu=1
            --memory=512Mi
            --concurrency=80
            --min-instances=0
            --max-instances=5

      - name: Smoke test deployed services
        shell: bash
        env:
          ORCHESTRATOR_URL: ${{ steps.deploy-orchestrator.outputs.url }}
          WEB_URL: ${{ steps.deploy-web.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "${ORCHESTRATOR_URL}/healthz"
          curl --fail --show-error --silent \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "${WEB_URL}/" > /dev/null
          echo "Web: ${WEB_URL}"
          echo "Orchestrator: ${ORCHESTRATOR_URL}"
